name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-gtksource-5 gir1.2-vte-3.91 gdb xvfb make
      - name: Unit tests
        run: make test PYTHON=/usr/bin/python3
      - name: Doctor
        run: make check PYTHON=/usr/bin/python3
      - name: Starts without errors
        run: |
          export GDK_BACKEND=x11 GSK_RENDERER=cairo NO_AT_BRIDGE=1
          timeout 8 xvfb-run -a ./bin/aether . > log.txt 2>&1 || true
          cat log.txt
          ! grep -E "Traceback|Error" log.txt
      - name: Build .deb
        run: make deb
      - uses: actions/upload-artifact@v4
        with:
          name: aether-deb
          path: dist/*.deb
